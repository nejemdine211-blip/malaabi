<!doctype html>
<html lang="ar" dir="rtl" style="background:#0D0D0D;color-scheme:dark">
  <head>
    <meta name="color-scheme" content="dark" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>ملاعبي</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ملاعبي" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- شاشات إقلاع آيفون -->
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash/splash_1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />

    <style>
      html, body {
        background: #0D0D0D;
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        box-sizing: border-box;
      }
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea, select {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        background: #0D0D0D;
        min-height: 100vh;
        overscroll-behavior-y: contain;
      }
      #boot {
        position: fixed;
        inset: 0;
        background: #0D0D0D;
        z-index: 99999;
      }
    </style>
  </head>

  <body style="background:#0D0D0D;margin:0">
    <div id="boot"></div>
    <script>
      // تُترك الطبقة في iOS مع تلاش ناعم
    </script>
    <div id="root" style="background:#0D0D0D;min-height:100vh;"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // إخفاء طبقة الإقلاع فور جاهزية الصفحة
      function hideBoot() {
        var r = document.getElementById('root');
        if (!r || r.children.length === 0) { return setTimeout(hideBoot, 60); }
        if (!window.__bootDelay) { window.__bootDelay = 1; return setTimeout(hideBoot, 250); }
        var b = document.getElementById('boot');
        if (b) {
          b.style.transition = 'opacity .5s';
          b.style.opacity = '0';
          setTimeout(function () { b.remove(); }, 300);
        }
      }
      window.addEventListener('load', hideBoot);

      // تسجيل Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
